name: Deploy

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker image name (without registry host)
        required: true
        type: string
      context:
        description: Docker build context path
        required: false
        type: string
        default: '.'
      build-args:
        description: Docker build args (newline-separated KEY=VALUE)
        required: false
        type: string
        default: ''
      stable-tags:
        description: Comma-separated stable tags (e.g. latest, dev, staging). Empty pushes only commit SHA.
        required: false
        type: string
        default: latest
    secrets:
      REGISTRY_USER:
        required: true
      REGISTRY_PASSWORD:
        required: true
      DOCKER_BUILD_SECRETS:
        required: false

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate registry config
        shell: bash
        env:
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
        run: |
          set -euo pipefail
          if [[ -z "${REGISTRY_HOST}" ]]; then
            echo "::error::REGISTRY_HOST variable is not set (org or repo variable required)"
            exit 1
          fi

      - name: Compute tags
        id: meta
        shell: bash
        env:
          REGISTRY: ${{ vars.REGISTRY_HOST }}
          IMAGE: ${{ inputs.image-name }}
          STABLE_TAGS: ${{ inputs.stable-tags }}
        run: |
          set -euo pipefail

          sha="$(git rev-parse --short HEAD)"
          tags="${REGISTRY}/${IMAGE}:${sha}"

          stable="$(echo "${STABLE_TAGS}" | tr -d '[:space:]')"
          if [[ -n "${stable}" ]]; then
            IFS=',' read -ra arr <<< "${stable}"
            for t in "${arr[@]}"; do
              [[ -z "${t}" ]] && continue
              tags="${tags}"$'\n'"${REGISTRY}/${IMAGE}:${t}"
            done
          fi

          {
            echo 'tags<<EOF'
            echo "${tags}"
            echo 'EOF'
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ inputs.context }}
          build-args: ${{ inputs.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: ${{ secrets.DOCKER_BUILD_SECRETS }}
